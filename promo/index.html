<script type="module">
import * as THREE from 'three';

const W = 1920, H = 1080;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));

// ---------------- 时间线：每段的长度 = 最短时长 和 旁白说完 + 0.6 秒 取大 ----------------
const LINES = [
  { key: 'a', scene: 'V', at: .3, text: '我自己做了个 Mac 解压软件，压缩包拖进来，就解开。' },

  { key: 'c', scene: 'P', at: .3, text: '加密包？存过的密码，它会自动帮你试。' },
  { key: 'd', scene: 'G', at: .25, text: 'Windows 打包的中文乱码，也能自动修好。' },

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });

const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const INK = 0x2e2e30, BLUE = 0x4183c4, PAPER = 0xf7f7f7;

// =====================================================================
// V：白色方块阵
// =====================================================================
const sV = new THREE.Scene();
sV.background = new THREE.Color(0xffffff);
sV.fog = new THREE.Fog(0xffffff, 38, 80);
sV.environment = envTex; sV.environmentIntensity = 0.35;
const camV = new THREE.PerspectiveCamera(28, W / H, 1, 300);
sV.add(new THREE.HemisphereLight(0xffffff, 0xd8d8dc, 1.0));
const sunV = new THREE.DirectionalLight(0xffffff, 2.2);
sunV.position.set(-16, 30, 10); sunV.castShadow = true; sunV.shadow.mapSize.set(2048, 2048);
Object.assign(sunV.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 1, far: 90 });
sunV.shadow.bias = -0.0004; sunV.shadow.radius = 4;
sV.add(sunV);

const N = 50, HALF = (N - 1) / 2;
const cubeGeo = new RoundedBoxGeometry(0.9, 1, 0.9, 3, 0.14);
const field = new THREE.InstancedMesh(cubeGeo, new THREE.MeshStandardMaterial({ roughness: 0.7 }), N * N);

const VA = VOICE.find(v => v.key === 'a');

const cPaper = new THREE.Color(PAPER), cInk = new THREE.Color(INK), cBlue = new THREE.Color(BLUE), cWhite = new THREE.Color(0xffffff), tmpC = new THREE.Color();

  const ang = Math.atan2(home.z, home.x) + (hash(a, b * 9 + c) - .5) * 1.4, rad = 8.6 + (hash(c, a) - .5);

      h += 1.3 * Math.exp(-d * d / 3) * Math.exp(-since * .4);

// T：白色图标砖
// =====================================================================
const sT = new THREE.Scene();

sT.fog = new THREE.Fog(0xffffff, 16, 34);
sT.environment = envTex; sT.environmentIntensity = 0.9;
const camT = new THREE.PerspectiveCamera(30, W / H, 0.5, 200);
const sunT = new THREE.DirectionalLight(0xffffff, 1.6);

Object.assign(sunT.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 60 });

ground.receiveShadow = true; sT.add(ground);

// 砖面：白纸 + 深灰字 + 一条拉链缝；拉开后缝变成和 App 图标一样的深色口子

  const x = c.getContext('2d');
  x.fillStyle = '#fbfbfb'; x.beginPath(); x.roundRect(8, 8, 496, 496, 112); x.fill();
  x.fillStyle = '#222'; x.font = '700 104px -apple-system, "PingFang SC", sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(label, 256, 196);
  x.fillStyle = '#999'; x.font = '500 40px -apple-system, "PingFang SC", sans-serif'; x.fillText(sub, 256, 282);
  // 拉链：细缝 + 小齿
  const cx = 256, top = 336, bot = 452;

const TILES = [['zip', '常见格式'], ['7z', '高压缩'], ['rar', 'RAR5 也行'], ['分卷', '.part1 / .001'], ['加密', '密码本']];
const STEP = 3.0;

  face.position.y = 0.256; g.add(base, face);
  g.position.set(i * STEP, 0.25, 0); sT.add(g);
  const bits = [...Array(9)].map((_, k) => {
    const m = new THREE.Mesh(new RoundedBoxGeometry(0.28, 0.28, 0.28, 2, 0.07),
      new THREE.MeshStandardMaterial({ color: k % 3 === 0 ? INK : BLUE, roughness: 0.4 }));
    m.castShadow = true; sT.add(m); return m;
  });
  return { g, face, closed, opened, bits, x: i * STEP };
});
const ACT = i => 0.55 + i * 0.6;   // 第 i 块砖被拉开的时刻（段内）
function frameT(s) {
  // 镜头：低机位从左往右平移，略微俯视
  const k = easeInOut(s / SC.T.len);
  const cx = lerp(0.2, STEP * 3.4, k);
  camT.position.set(cx - 2.2, 8.2, 7.0); camT.lookAt(cx + 0.9, 0, -0.3);
  sunT.position.set(cx - 6, 14, 9); sunT.target.position.set(cx, 0, 0);
  tiles.forEach((tl, i) => {
    const u = s - ACT(i);
    tl.face.material.map = u > 0 ? tl.opened : tl.closed;
    tl.g.position.y = 0.25 + (u > 0 ? -0.14 * Math.exp(-u * 6) * Math.cos(u * 18) : 0);
    tl.bits.forEach((m, q) => {
      const kk = u - 0.03; m.visible = kk > 0 && kk < 1.4;
      if (!m.visible) return;
      const a = q / 9 * Math.PI * 2 + hash(i, q), sp = 1.0 + 1.3 * hash(q, i);
      m.position.set(tl.x + Math.cos(a) * sp * kk, 0.6 + (3.4 + 1.4 * hash(i * 3, q)) * kk - 7.5 * kk * kk, Math.sin(a) * sp * kk);
      m.rotation.set(kk * 6 * hash(q, 1), kk * 5, 0);
      m.scale.setScalar(1 - smooth((kk - 1.0) / 0.4));
    });
  });
  renderer.render(sT, camT);
}

// =====================================================================
// P / G / L：软件界面
// =====================================================================
const DOC = '<svg class="ic"><use href="#doc"/></svg>';
function row(name, tag, status) { return `<div class="row">${DOC}<div style="flex:1"><div class="name">${name}${tag ? `<small>${tag}</small>` : ''}</div>${status}</div></div>`; }
const done = (what) => `<div class="st"><span class="ck">✓</span>已放到「下载」里：${what}<span class="dot">·</span><span class="link">在访达中显示</span><span class="dot">·</span><span class="link">查看内容</span></div>`;

// 查看内容里的名字：先是乱码（Windows GBK 被当成西文读出来的样子），扫描线扫过一行就变回中文
const NAMES = [
  ['folder', '设计素材', 'Éè¼ÆËØ²Ä', ''],
  ['file', '设计素材/海报-最终版.psd', 'Éè¼ÆËØ²Ä/º£±¨-×îÖÕ°æ.psd', '2.9 MB'],
  ['file', '设计素材/门店菜单-定稿.pdf', 'Éè¼ÆËØ²Ä/ÃÅµê²Ëµ¥-¶¨¸å.pdf', '1.2 MB'],
  ['folder', '设计素材/产品图', 'Éè¼ÆËØ²Ä/²úÆ·Í¼', ''],
  ['file', '设计素材/产品图/精华液-正面.jpg', 'Éè¼ÆËØ²Ä/²úÆ·Í¼/¾«»ªÒº-ÕýÃæ.jpg', '386 KB'],
  ['file', '设计素材/产品图/精华液-侧面.jpg', 'Éè¼ÆËØ²Ä/²úÆ·Í¼/¾«»ªÒº-²àÃæ.jpg', '402 KB'],
  ['file', '设计素材/字体说明.txt', 'Éè¼ÆËØ²Ä/×ÖÌåËµÃ÷.txt', '2 KB'],
];
$('brows').innerHTML = NAMES.map(([ic, , bad, sz], i) =>
  `<div class="btr"><span class="cb"></span><svg class="fi" height="16"><use href="#${ic}"/></svg><span class="nm bad" id="nm${i}">${bad}</span><span class="sz">${sz}</span><span class="glow" id="gl${i}"></span></div>`).join('');

let lastUI = '';
function frameUI(t) {
  const k = sceneAt(t);
  const ui = $('ui'), win = $('win');
  const inUI = ['P', 'G', 'L'].includes(k) || (k === 'E' && local(t, 'E') < 0.8);
  ui.style.opacity = k === 'E' ? 1 - smooth(local(t, 'E') / 0.7) : (['P', 'G', 'L'].includes(k) ? 1 : 0);
  if (!inUI) return;
  const sP = local(t, 'P'), sG = local(t, 'G'), sL = local(t, 'L');
  $('v-list').style.opacity = (k === 'P' || k === 'L' || k === 'E') ? 1 : 0;
  $('v-browse').style.opacity = k === 'G' ? 1 : 0;
  // 镜头：窗口从微微后仰立起来，然后推近到要讲的那一块
  let rx = 0, sc = 1, ty = 0, tx = 0;
  if (k === 'P') {
    const enter = easeOut(sP / 0.9);
    rx = lerp(16, 0, enter); sc = lerp(0.92, 1, enter);
    const zoom = easeInOut((sP - 0.9) / 1.1);
    sc *= lerp(1, 1.14, zoom); ty = lerp(0, -10, zoom); tx = lerp(0, 40, zoom);
  } else if (k === 'G') {
    sc = lerp(1.0, 1.06, sG / SC.G.len); ty = lerp(6, -6, sG / SC.G.len);
  } else {
    const s = k === 'L' ? sL : SC.L.len + local(t, 'E');
    sc = lerp(1.0, 1.06, s / SC.L.len); rx = lerp(0, -4, s / SC.L.len);
  }
  win.style.transform = `translate(${tx}px, ${ty}px) rotateX(${rx}deg) scale(${sc})`;

  const pill = $('pill');
  pill.style.opacity = 0;
  if (k === 'P') {
    // 密码本自动试：密码框里一串串点快速换，进度线走完 → 打勾
    const ok = sP > 2.6;
    const tries = Math.min(7, Math.floor(Math.max(0, sP - 0.9) / 0.24));
    const pwRow = ok ? done('客户合同')
      : `<div class="st">这个包加了密码，正在用密码本里的密码自动试…</div>
         <div class="pw"><span class="field">${'●'.repeat(4 + (tries * 3) % 5)}</span><span style="color:var(--sec)">第 ${tries + 1} 个</span></div>
         <div class="bar2" style="width:300px"><i style="width:${Math.min(100, (sP - 0.9) / 1.7 * 100)}%"></i></div>`;
    const html = row('2026品牌手册.7z', '', done('2026品牌手册')) + row('客户合同.zip', '', pwRow) + row('门店培训视频.7z.001', '3 卷', `<div class="st">排队中</div>`);
    if (html !== lastUI) { $('rows').innerHTML = html; lastUI = html; }
    if (ok) { pill.textContent = '密码本命中 ✓'; pill.style.left = '250px'; pill.style.top = '226px'; pill.style.opacity = clamp((sP - 2.6) / 0.3); }
  } else if (k === 'L' || k === 'E') {
    const s = k === 'L' ? sL : SC.L.len;
    const items = [['门店培训视频.7z.001', '3 卷', '培训视频.mp4', 0.3], ['设计素材.zip', '', '设计素材', 0.9], ['年终总结.tar.gz', '', '年终总结', 1.5]];
    let html = '';
    for (const [n, tag, out, at] of items) {
      const p = clamp((s - at) / 0.9);
      html += row(n, tag, p >= 1 ? done(out)
        : p <= 0 ? `<div class="st">排队中</div>`
        : `<div class="st">解压 ${Math.round(p * 100)}% · ${(380 + 90 * Math.sin(at * 9)).toFixed(0)} MB/s<span class="dot">·</span><span class="link">取消</span></div><div class="bar2"><i style="width:${p * 100}%"></i></div>`);
    }
    // 垃圾文件：依次划掉、淡出
    const j = [['__MACOSX', 2.5], ['.DS_Store', 2.75], ['Thumbs.db', 3.0]].map(([n, at]) => {
      const u = clamp((s - at) / 0.35);
      return `<span style="opacity:${1 - 0.6 * u}">${u > 0 ? `<s>${n}</s>` : n}</span>`;
    }).join('');
    html += `<div class="junk" style="opacity:${clamp((s - 2.2) / 0.3)}">已自动清掉：${j}</div>`;
    if (html !== lastUI) { $('rows').innerHTML = html; lastUI = html; }
  }
  if (k === 'G') {
    // 扫描线从上往下，扫过一行就把乱码换成中文，那一行闪一下蓝
    const y0 = 88, y1 = 88 + NAMES.length * 25;
    const p = clamp((sG - 0.8) / 2.0), y = lerp(y0, y1, easeInOut(p));
    $('scan').style.top = y + 'px'; $('scan').style.opacity = p > 0 && p < 1 ? 1 : 0;
    NAMES.forEach(([, good, bad], i) => {
      const rowY = y0 + i * 25 + 12, fixed = p > 0 && y > rowY;
      const el = $('nm' + i);
      el.textContent = fixed ? good : bad; el.className = 'nm' + (fixed ? '' : ' bad');
      const since = fixed ? (y - rowY) / (y1 - y0) * 2.0 : -1;
      $('gl' + i).style.opacity = fixed ? clamp(1 - since / 0.5) : 0;
    });
  }
}

// =====================================================================
// 字幕、转场、结尾
// =====================================================================
// 字幕一次一行：按逗号、句号拆开，按字数分配这句话的时长
const SUBS = [];
for (const v of VOICE) {
  const parts = v.text.split(/(?<=[，。？、])/).reduce((a, p) => { if (a.length && (a[a.length - 1] + p).replace(/[，。？、]/g, '').length <= 9) a[a.length - 1] += p; else a.push(p); return a; }, []);
  const total = parts.reduce((n, p) => n + p.length, 0);
  let t0 = SC[v.scene].start + v.at;
  for (const p of parts) { const d = v.dur * p.length / total; SUBS.push({ a: t0, b: t0 + d, text: p.replace(/[，。、]$/, '') }); t0 += d; }
}
function overlay(t) {
  const sub = SUBS.find(s => t >= s.a && t < s.b + 0.15);
  $('sub').textContent = sub && sceneAt(t) !== 'E' ? sub.text : '';
  // 转场：V→T、T→P 两次白闪
  const f = (b) => clamp(1 - Math.abs(t - b) / 0.28);
  $('flash').style.opacity = Math.max(f(SC.T.start), f(SC.P.start) * 0.9);
  const e = local(t, 'E');
  $('end').style.opacity = smooth((e - 0.2) / 0.7);
  $('end-icon').style.transform = `scale(${lerp(0.84, 1, easeOut((e - 0.2) / 1.1))})`;
}

function frame(t) {
  const k = sceneAt(t);
  if (k === 'V') frameV(local(t, 'V'));
  else if (k === 'T') frameT(local(t, 'T'));
  renderer.domElement.style.visibility = (k === 'V' || k === 'T') ? 'visible' : 'hidden';
  frameUI(t);
  overlay(t);
}

// 音效、旁白时间表（交给 audio.mjs / record.mjs）
function events() {
  const ev = [];
  ev.push({ t: BURST - 0.5, type: 'riser' }, { t: BURST, type: 'boom' });
  ev.push({ t: SC.T.start - 0.25, type: 'whoosh' });
  TILES.forEach((_, i) => ev.push({ t: SC.T.start + ACT(i), type: 'pop' }));
  ev.push({ t: SC.P.start - 0.25, type: 'whoosh' });
  for (let i = 0; i < 7; i++) ev.push({ t: SC.P.start + 0.9 + i * 0.24, type: 'tick' });
  ev.push({ t: SC.P.start + 2.6, type: 'ok' });
  ev.push({ t: SC.G.start, type: 'swipe' });
  NAMES.forEach((_, i) => ev.push({ t: SC.G.start + 0.8 + 2.0 * (i + .5) / NAMES.length, type: 'tick' }));
  [0.3, 0.9, 1.5].forEach(a => ev.push({ t: SC.L.start + a + 0.9, type: 'ok' }));
  ev.push({ t: SC.E.start + 0.25, type: 'chime' });
  return ev;
}
const voiceTrack = () => VOICE.map(v => ({ key: v.key, at: SC[v.scene].start + v.at, dur: v.dur }));
window.PROMO = { END, frame, events, voiceTrack, drop: BURST, scenes: SC, hasVoice: !!window.VOICE };
if (!new URLSearchParams(location.search).has('rec')) {
  const t0 = performance.now();
  const loop = () => { frame(((performance.now() - t0) / 1000) % END); requestAnimationFrame(loop); };
  loop();
}
