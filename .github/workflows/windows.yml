# Windows 版：编译成单文件 exe，配上官方 7-Zip（7z.exe + 7z.dll，自带 RAR 解码），打包并跑自测
name: windows

on:
  push:
    paths: ["windows/**", "VERSION", ".github/workflows/windows.yml"]
  release:
    types: [published]   # 在 GitHub 上发新版时：编好后把 Windows 的两个包传到这个版本下面（软件里的自动更新从这里下载）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Get official 7-Zip
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.7-zip.org/a/7z2501-x64.exe -OutFile 7zsetup.exe
          & "C:\Program Files\7-Zip\7z.exe" x 7zsetup.exe -o"7zip" -y | Out-Null
          foreach ($f in "7z.exe", "7z.dll", "License.txt") { if (!(Test-Path "7zip\$f")) { throw "missing $f" } }
          & .\7zip\7z.exe i | Select-Object -First 3

      - name: Publish
        shell: pwsh
        run: dotnet publish windows/Unpack.csproj -c Release -r win-x64 -o publish "-p:Version=$((Get-Content VERSION).Trim())"

      - name: Assemble
        shell: pwsh
        run: |
          $d = "dist\Unpack"
          New-Item -ItemType Directory $d | Out-Null
          Copy-Item publish\Unpack.exe "$d\解压.exe"
          Copy-Item 7zip\7z.exe, 7zip\7z.dll $d
          Copy-Item 7zip\License.txt "$d\7-Zip License.txt"
          Copy-Item windows\README.txt $d
          Get-ChildItem $d | Format-Table Name, Length
          & .\7zip\7z.exe a -tzip -mcu=on -mx=9 Unpack-Windows-x64.zip .\dist\Unpack\* | Out-Null
          Get-Item Unpack-Windows-x64.zip | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Unpack-Windows-x64
          path: Unpack-Windows-x64.zip

      - name: Install WinRAR (for RAR tests, optional)
        continue-on-error: true
        shell: pwsh
        run: choco install winrar -y --no-progress | Select-Object -Last 3

      - name: Self-test
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: python windows/tests/run_tests.py dist\Unpack

      - name: UI screenshots
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots\$name.png"); $g.Dispose(); $bmp.Dispose()
          }
          New-Item -ItemType Directory shots | Out-Null
          $exe = (Resolve-Path "dist\Unpack\解压.exe").Path
          New-Item -ItemType Directory "$env:APPDATA\Unpack" -Force | Out-Null
          Set-Content "$env:APPDATA\Unpack\settings.json" '{"Reveal": false}'   # 截图时别弹资源管理器盖住窗口
          $p = Start-Process $exe -PassThru; Start-Sleep 6; Shot "1-empty"
          # 再开一次带参数：交给已经开着的窗口（单实例），一个能解的 + 一个要密码的
          New-Item -ItemType Directory demo | Out-Null
          Set-Content demo\a.txt "hello"; & .\7zip\7z.exe a -p999 -mhe=on demo\locked.7z demo\a.txt | Out-Null
          & .\7zip\7z.exe a demo\photos.zip demo\a.txt | Out-Null
          Start-Process $exe -ArgumentList "`"$((Resolve-Path demo\photos.zip).Path)`"", "`"$((Resolve-Path demo\locked.7z).Path)`""
          Start-Sleep 6; Shot "2-jobs"
          if ($p.HasExited) { throw "main window exited" }
          if ((Get-Process -Name "解压" -ErrorAction SilentlyContinue | Measure-Object).Count -gt 1) { throw "second instance did not hand over" }
          Stop-Process -Name "解压" -Force -ErrorAction SilentlyContinue

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Select-Object -Last 2
          $iscc = (Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" | Select-Object -First 1).FullName
          # 简体中文界面：新版 Inno Setup 自带，旧版从官方仓库取
          $zh = Join-Path (Split-Path $iscc) "Languages\ChineseSimplified.isl"
          if (Test-Path $zh) { Copy-Item $zh windows\ } else {
            try { Invoke-WebRequest https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl -OutFile windows\ChineseSimplified.isl }
            catch { Invoke-WebRequest https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/ChineseSimplified.isl -OutFile windows\ChineseSimplified.isl }
          }
          & $iscc /Q "/DSrc=$((Resolve-Path dist\Unpack).Path)" "/DAppVer=$((Get-Content VERSION).Trim())" windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
          Get-Item Unpack-Setup-x64.exe | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Unpack-Setup-x64
          path: Unpack-Setup-x64.exe

      - name: Installer test
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots\$name.png"); $g.Dispose(); $bmp.Dispose()
          }
          # 安装界面第一页截个图就关掉
          $w = Start-Process .\Unpack-Setup-x64.exe -PassThru; Start-Sleep 5; Shot "3-setup"; Stop-Process $w.Id -Force -ErrorAction SilentlyContinue
          Get-Process | Where-Object { $_.ProcessName -like "Unpack-Setup*" -or $_.ProcessName -like "is-*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep 2
          # 静默装给当前用户
          $p = Start-Process .\Unpack-Setup-x64.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/NORESTART", "/TASKS=assoc,menu" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "setup exit $($p.ExitCode)" }
          $app = "$env:LOCALAPPDATA\Programs\Unpack"
          foreach ($f in "解压.exe", "7z.exe", "7z.dll", "archive.ico", "unins000.exe") { if (!(Test-Path "$app\$f")) { throw "missing $f" } }
          foreach ($e in ".zip", ".7z", ".rar", ".001") {
            $v = (Get-ItemProperty "HKCU:\Software\Classes\$e").'(default)'
            if ($v -ne "Unpack.Archive") { throw "$e -> $v" }
          }
          $icon = (Get-ItemProperty "HKCU:\Software\Classes\Unpack.Archive\DefaultIcon").'(default)'; "icon: $icon"
          $cmd = (Get-ItemProperty "HKCU:\Software\Classes\Unpack.Archive\shell\open\command").'(default)'; "open: $cmd"
          if (!(Test-Path 'HKCU:\Software\Classes\*\shell\Unpack')) { throw "context menu missing" }
          # 资源管理器里看图标：几种压缩包放一个文件夹，大图标视图
          $d = "$env:USERPROFILE\Desktop\图标"; New-Item -ItemType Directory $d -Force | Out-Null
          foreach ($n in "照片.zip", "资料.7z", "视频.part1.rar", "备份.tar.gz", "大文件.7z.001", "说明.txt") { Set-Content "$d\$n" "x" }
          Start-Process explorer.exe $d; Start-Sleep 8
          $sh = New-Object -ComObject Shell.Application
          foreach ($win in $sh.Windows()) { try { if ($win.Document.Folder.Self.Path -eq $d) { $win.Document.CurrentViewMode = 1; $win.Document.IconSize = 96 } } catch {} }
          Start-Sleep 6; Shot "4-explorer-icons"
          # 双击：zip/7z/rar 在 Windows 11 上归系统管（要用户在「默认应用」里点一次），程序没法替他选；
          # 系统不认识的格式（分卷 .001）双击就该直接交给解压.exe 解开
          & .\7zip\7z.exe a -v100k "$d\真的.7z" "$d\说明.txt" | Out-Null
          # 只截图看「默认应用」那栏是不是解压：机器上还有别的解压软件（这里装了 WinRAR）时 Windows 11 会先问一次，这一步只能用户点
          Start-Process "$d\真的.7z.001"; Start-Sleep 6; Shot "5-double-click-001"
          Get-Process OpenWith -ErrorAction SilentlyContinue | Stop-Process -Force
          Stop-Process -Name "解压" -Force -ErrorAction SilentlyContinue
          $before = (Get-ChildItem $d).Count
          Start-Process "$app\解压.exe" -ArgumentList "`"$d\真的.7z.001`""; Start-Sleep 8
          if ((Get-ChildItem $d).Count -le $before) { throw "open command did not extract .001" }
          # 「默认应用」里选了解压之后走的是注册的打开命令：照着命令手动跑一遍 zip
          & .\7zip\7z.exe a "$d\真的.zip" "$d\说明.txt" | Out-Null
          $before = (Get-ChildItem $d).Count
          Start-Process "$app\解压.exe" -ArgumentList "`"$d\真的.zip`""; Start-Sleep 8
          if ((Get-ChildItem $d).Count -le $before) { throw "open command did not extract zip" }
          Stop-Process -Name "解压" -Force -ErrorAction SilentlyContinue
          # 覆盖升级（软件里点「更新」走的就是这条）：静默装同一个包 + /RELAUNCH=1，装完软件要自己重新打开
          $p = Start-Process .\Unpack-Setup-x64.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/NORESTART", "/RELAUNCH=1", "/LOG=$env:TEMP\upgrade.log" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "upgrade exit $($p.ExitCode)" }
          for ($i = 0; $i -lt 15 -and !(Get-Process -Name "解压" -ErrorAction SilentlyContinue); $i++) { Start-Sleep 1 }
          if (!(Get-Process -Name "解压" -ErrorAction SilentlyContinue)) { Get-Content "$env:TEMP\upgrade.log" | Select-String -Pattern "Run|Filename|Process|exit|Error" ; throw "not relaunched after upgrade" }
          if ((Get-ItemProperty "HKCU:\Software\Classes\.rar").'(default)' -ne "Unpack.Archive") { throw "association lost after upgrade" }
          Shot "6-after-upgrade"
          Stop-Process -Name "解压" -Force -ErrorAction SilentlyContinue
                    # 卸载：注册的东西都要清掉
          $u = Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -PassThru -Wait
          Start-Sleep 3
          if (Test-Path "HKCU:\Software\Classes\Unpack.Archive") { throw "ProgID left after uninstall" }
          if ((Get-ItemProperty "HKCU:\Software\Classes\.rar" -ErrorAction SilentlyContinue).'(default)' -eq "Unpack.Archive") { throw ".rar still associated" }
          if (Test-Path 'HKCU:\Software\Classes\*\shell\Unpack') { throw "context menu left" }
          if (Test-Path "$app\解压.exe") { throw "files left" }
          "installer OK"

      - name: Attach to release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" Unpack-Windows-x64.zip Unpack-Setup-x64.exe --clobber

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: shots/
