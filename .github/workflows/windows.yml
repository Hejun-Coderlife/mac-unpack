# Windows 版：编译成单文件 exe，配上官方 7-Zip（7z.exe + 7z.dll，自带 RAR 解码），打包并跑自测
name: windows

on:
  push:
    paths: ["windows/**", "VERSION", ".github/workflows/windows.yml"]
  release:
    types: [published]   # 在 GitHub 上发新版时：编好后把 Windows 的两个包传到这个版本下面（软件里的自动更新从这里下载）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Get official 7-Zip
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.7-zip.org/a/7z2501-x64.exe -OutFile 7zsetup.exe
          & "C:\Program Files\7-Zip\7z.exe" x 7zsetup.exe -o"7zip" -y | Out-Null
          foreach ($f in "7z.exe", "7z.dll", "License.txt") { if (!(Test-Path "7zip\$f")) { throw "missing $f" } }
          & .\7zip\7z.exe i | Select-Object -First 3

      - name: Publish
        shell: pwsh
        run: dotnet publish windows/Unpack.csproj -c Release -r win-x64 -o publish "-p:Version=$((Get-Content VERSION).Trim())"

      - name: Assemble
        shell: pwsh
        run: |
          $d = "dist\Unpack"
          New-Item -ItemType Directory $d | Out-Null
          Copy-Item publish\Unpack.exe "$d\解压.exe"
          Copy-Item 7zip\7z.exe, 7zip\7z.dll $d
          Copy-Item 7zip\License.txt "$d\7-Zip License.txt"
          Copy-Item windows\README.txt $d
          Get-ChildItem $d | Format-Table Name, Length
          & .\7zip\7z.exe a -tzip -mcu=on -mx=9 Unpack-Windows-x64.zip .\dist\Unpack\* | Out-Null
          Get-Item Unpack-Windows-x64.zip | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Unpack-Windows-x64
          path: Unpack-Windows-x64.zip

      - name: Install WinRAR (for RAR tests, optional)
        continue-on-error: true
        shell: pwsh
        run: choco install winrar -y --no-progress | Select-Object -Last 3

      - name: Self-test
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: python windows/tests/run_tests.py dist\Unpack

      - name: UI screenshots
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots\$name.png"); $g.Dispose(); $bmp.Dispose()
          }
          New-Item -ItemType Directory shots | Out-Null
          $exe = (Resolve-Path "dist\Unpack\解压.exe").Path
          New-Item -ItemType Directory "$env:APPDATA\Unpack" -Force | Out-Null
          Set-Content "$env:APPDATA\Unpack\settings.json" '{"Reveal": false}'   # 截图时别弹资源管理器盖住窗口
          $p = Start-Process $exe -PassThru; Start-Sleep 6; Shot "1-empty"
          # 再开一次带参数：交给已经开着的窗口（单实例），一个能解的 + 一个要密码的
          New-Item -ItemType Directory demo | Out-Null
          Set-Content demo\a.txt "hello"; & .\7zip\7z.exe a -p999 -mhe=on demo\locked.7z demo\a.txt | Out-Null
          & .\7zip\7z.exe a demo\photos.zip demo\a.txt | Out-Null
          Start-Process $exe -ArgumentList "`"$((Resolve-Path demo\photos.zip).Path)`"", "`"$((Resolve-Path demo\locked.7z).Path)`""
          Start-Sleep 6; Shot "2-jobs"
          if ($p.HasExited) { throw "main window exited" }
          if ((Get-Process -Name "解压" -ErrorAction SilentlyContinue | Measure-Object).Count -gt 1) { throw "second instance did not hand over" }
          Stop-Process -Name "解压" -Force -ErrorAction SilentlyContinue
          # 新窗口：查看内容、新建压缩包；浅色、深色各截一张
          foreach ($mode in "light", "dark") {
            Set-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" -Name AppsUseLightTheme -Value ([int]($mode -eq "light")) -Type DWord -Force
            foreach ($w in @(@("browse", "demo\photos.zip"), @("compose", "demo"))) {
              $env:UNPACK_SHOW = "$($w[0]):$((Resolve-Path $w[1]).Path)"
              Start-Process $exe; Start-Sleep 6; Shot "8-$($w[0])-$mode"
              Stop-Process -Name "解压" -Force -ErrorAction SilentlyContinue; Start-Sleep 1
            }
          }
          Remove-Item Env:UNPACK_SHOW
          # 自动解开「下载」：开着时新放进来的压缩包（先是 .crdownload 半截，再改名）要被解开、原包进回收站；原来就在的不动
          $wd = "$env:TEMP\watch-dl"; New-Item -ItemType Directory $wd -Force | Out-Null
          Copy-Item demo\photos.zip "$wd\已经在的.zip"
          Set-Content "$env:APPDATA\Unpack\settings.json" '{"Reveal": false, "Notify": false, "WatchDownloads": true}'
          $env:UNPACK_WATCH_DIR = $wd
          Start-Process $exe; Start-Sleep 5
          Copy-Item demo\photos.zip "$wd\新下的.zip.crdownload"; Start-Sleep 4
          Rename-Item "$wd\新下的.zip.crdownload" "新下的.zip"; Start-Sleep 12
          Get-ChildItem $wd | Format-Table Name
          Stop-Process -Name "解压" -Force -ErrorAction SilentlyContinue
          Remove-Item Env:UNPACK_WATCH_DIR
          Set-Content "$env:APPDATA\Unpack\settings.json" '{"Reveal": false}'
          if (Test-Path "$wd\新下的.zip") { throw "watch: new archive not extracted/recycled" }
          if (!(Test-Path "$wd\已经在的.zip")) { throw "watch: existing archive was touched" }
          if (!(Test-Path "$wd\demo\a.txt")) { throw "watch: extracted file missing" }   # photos.zip 里存的是 demo\a.txt
          Set-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" -Name AppsUseLightTheme -Value 1 -Type DWord -Force

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Select-Object -Last 2
          $iscc = (Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" | Select-Object -First 1).FullName
          # 简体中文界面：新版 Inno Setup 自带，旧版从官方仓库取
          $zh = Join-Path (Split-Path $iscc) "Languages\ChineseSimplified.isl"
          if (Test-Path $zh) { Copy-Item $zh windows\ } else {
            try { Invoke-WebRequest https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl -OutFile windows\ChineseSimplified.isl }
            catch { Invoke-WebRequest https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/ChineseSimplified.isl -OutFile windows\ChineseSimplified.isl }
          }
          & $iscc /Q "/DSrc=$((Resolve-Path dist\Unpack).Path)" "/DAppVer=$((Get-Content VERSION).Trim())" windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
          Get-Item Unpack-Setup.exe | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Unpack-Setup
          path: Unpack-Setup.exe

      # 安装 → 图标 → 双击 → 升级 → 卸载，整套走一遍
      # 等安装程序用 WaitForExit：pwsh 的 Start-Process -Wait 会连子进程一起等，装完自动打开的解压.exe 一直开着就卡死
      - name: Installer test
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots\$name.png"); $g.Dispose(); $bmp.Dispose()
          }
          function Running { [bool](Get-Process -Name "解压" -ErrorAction SilentlyContinue) }
          function WaitRunning { for ($i = 0; $i -lt 20 -and !(Running); $i++) { Start-Sleep 1 }; Running }
          Stop-Process -Name "解压" -Force -ErrorAction SilentlyContinue
          # 前面 RAR 自测装了 WinRAR：卸掉，免得双击时 Windows 因为「有新的应用」先弹选择框
          choco uninstall winrar -y --no-progress | Select-Object -Last 1
          # 模拟 v1.0 zip 版用户开过右键菜单（指向旧文件夹里的解压.exe）：装完应改指到新位置
          $old = (Resolve-Path "dist\Unpack\解压.exe").Path
          foreach ($k in 'HKCU:\Software\Classes\*\shell\Unpack', 'HKCU:\Software\Classes\Directory\shell\Unpack') {
            New-Item -Path "$k\command" -Force | Out-Null
            Set-Item -LiteralPath $k -Value "用「解压」处理"; Set-Item -LiteralPath "$k\command" -Value "`"$old`" `"%1`""
          }

          # 1. 像普通人那样装：双击安装程序 → 截图 → 按回车（「安装」）→ 应该自动打开解压 → 完成页截图
          $w = Start-Process .\Unpack-Setup.exe -PassThru; Start-Sleep 6; Shot "3-setup"
          $wiz = Get-Process | Where-Object { $_.ProcessName -like "Unpack-Setup*" -and $_.MainWindowHandle -ne 0 } | Select-Object -First 1
          $ws = New-Object -ComObject WScript.Shell; [void]$ws.AppActivate($wiz.Id); Start-Sleep 1
          [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")
          if (!(WaitRunning)) { Shot "3b-setup-stuck"; throw "app not opened automatically after install" }
          Start-Sleep 3; Shot "3c-setup-finished"
          Get-Process | Where-Object { $_.ProcessName -like "Unpack-Setup*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Stop-Process -Name "解压" -Force -ErrorAction SilentlyContinue
          $app = "$env:LOCALAPPDATA\Programs\Unpack"
          foreach ($f in "解压.exe", "7z.exe", "7z.dll", "archive.ico", "unins000.exe") { if (!(Test-Path "$app\$f")) { throw "missing $f" } }
          # 桌面、开始菜单各只有一个「解压」
          $desk = [Environment]::GetFolderPath("Desktop"); $menu = [Environment]::GetFolderPath("Programs")
          $dl = @(Get-ChildItem $desk -Filter *.lnk | Where-Object { $_.BaseName -match "解压|Unpack" }); "desktop: $($dl.Name)"
          $ml = @(Get-ChildItem $menu -Recurse | Where-Object { $_.BaseName -match "解压|Unpack" }); "start menu: $($ml.Name)"
          if ($dl.Count -ne 1 -or $ml.Count -ne 1) { throw "shortcuts: desktop $($dl.Count), start menu $($ml.Count)" }
          # 「设置 → 应用」里能看到、能卸载
          $un = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" | Where-Object { $_.DisplayName -eq "解压" }
          if (!$un) { throw "not in Apps list" }; "apps list: $($un.DisplayName) $($un.DisplayVersion)"
          foreach ($e in ".zip", ".7z", ".rar", ".001") {
            $v = (Get-ItemProperty "HKCU:\Software\Classes\$e").'(default)'
            if ($v -ne "Unpack.Archive") { throw "$e -> $v" }
          }
          $mc = (Get-Item -LiteralPath 'HKCU:\Software\Classes\*\shell\Unpack\command').GetValue(""); "menu: $mc"
          if ($mc -notlike "*$app*") { throw "old context menu not repointed" }

          # 2. 图标：几种压缩包放一个文件夹，大图标视图
          $d = "$desk\图标"; New-Item -ItemType Directory $d -Force | Out-Null
          foreach ($n in "照片.zip", "资料.7z", "视频.part1.rar", "备份.tar.gz", "大文件.7z.001", "说明.txt") { Set-Content "$d\$n" "x" }
          Start-Process explorer.exe $d; Start-Sleep 8
          $sh = New-Object -ComObject Shell.Application
          foreach ($win in $sh.Windows()) { try { if ($win.Document.Folder.Self.Path -eq $d) { $win.Document.CurrentViewMode = 1; $win.Document.IconSize = 96 } } catch {} }
          Start-Sleep 6; Shot "4-explorer-icons"

          # 3. 双击：系统不管的格式（分卷 .001）双击直接解开；zip 是系统管的，第一次会问用什么打开（截图看）
          & .\7zip\7z.exe a -v100k "$d\真的.7z" "$d\说明.txt" | Out-Null
          $before = (Get-ChildItem $d).Count
          Start-Process "$d\真的.7z.001"; Start-Sleep 8; Shot "5-double-click-001"
          Get-ChildItem $d | Format-Table Name
          if ((Get-ChildItem $d).Count -le $before) { throw "double-click .001 did not extract" }
          Get-Process OpenWith -ErrorAction SilentlyContinue | Stop-Process -Force
          Stop-Process -Name "解压" -Force -ErrorAction SilentlyContinue
          & .\7zip\7z.exe a "$d\真的.zip" "$d\说明.txt" | Out-Null
          Start-Process "$d\真的.zip"; Start-Sleep 6; Shot "6-double-click-zip"
          Get-Process OpenWith -ErrorAction SilentlyContinue | Stop-Process -Force
          Stop-Process -Name "解压" -Force -ErrorAction SilentlyContinue
          # 在「默认应用」里选了解压以后，双击 zip 走的就是注册的打开命令：照着跑一遍
          $before = (Get-ChildItem $d).Count
          $cmd = (Get-ItemProperty "HKCU:\Software\Classes\Unpack.Archive\shell\open\command").'(default)'; "open: $cmd"
          Start-Process "$app\解压.exe" -ArgumentList "`"$d\真的.zip`""; Start-Sleep 8
          if ((Get-ChildItem $d).Count -le $before) { throw "open command did not extract zip" }
          Stop-Process -Name "解压" -Force -ErrorAction SilentlyContinue

          # 4. 升级（软件里点「更新」走的就是这条）：静默装 + /RELAUNCH=1，装完软件要自己重新打开
          $p = Start-Process .\Unpack-Setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/RELAUNCH=1", "/LOG=$env:TEMP\upgrade.log" -PassThru; $p.WaitForExit()
          if ($p.ExitCode -ne 0) { throw "upgrade exit $($p.ExitCode)" }
          if (!(WaitRunning)) { Get-Content "$env:TEMP\upgrade.log" | Select-String -Pattern "Run|Filename|exit|Error"; throw "not relaunched after upgrade" }
          if ((Get-ItemProperty "HKCU:\Software\Classes\.rar").'(default)' -ne "Unpack.Archive") { throw "association lost after upgrade" }
          Shot "7-after-upgrade"
          Stop-Process -Name "解压" -Force -ErrorAction SilentlyContinue

          # 5. 卸载：文件、快捷方式、文件类型、右键菜单、设置都要清掉
          $u = Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -PassThru; $u.WaitForExit()
          # 卸载程序会把自己复制到临时目录再跑，原进程马上就退：等文件真被删掉
          for ($i = 0; $i -lt 30 -and (Test-Path "$app\解压.exe"); $i++) { Start-Sleep 1 }
          Start-Sleep 2
          $left = @()
          if (Test-Path "$app\解压.exe") { $left += "files" }
          if (Test-Path "HKCU:\Software\Classes\Unpack.Archive") { $left += "ProgID" }
          if ((Get-ItemProperty "HKCU:\Software\Classes\.rar" -ErrorAction SilentlyContinue).'(default)' -eq "Unpack.Archive") { $left += ".rar" }
          if (Test-Path -LiteralPath 'HKCU:\Software\Classes\*\shell\Unpack') { $left += "context menu" }
          if (Test-Path "HKCU:\Software\Unpack") { $left += "capabilities" }
          if (@(Get-ChildItem $desk -Filter *.lnk | Where-Object { $_.BaseName -match "解压|Unpack" }).Count) { $left += "desktop shortcut" }
          if (@(Get-ChildItem $menu -Recurse | Where-Object { $_.BaseName -match "解压|Unpack" }).Count) { $left += "start menu" }
          if (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" | Where-Object { $_.DisplayName -eq "解压" }) { $left += "apps list" }
          if (Test-Path "$env:APPDATA\Unpack") { $left += "settings" }
          if ($left.Count) { throw "left after uninstall: $($left -join ', ')" }
          "installer OK"

      - name: Attach to release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" Unpack-Setup.exe --clobber   # Windows 只发一个 exe（安装包），不发一堆文件的 zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: shots/
